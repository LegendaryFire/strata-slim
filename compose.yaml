# strata-slim with Docker Compose. The server's settings live in .env (copy example.env); see docs/docker-compose.md.
#
#   cp example.env .env      # then edit it
#   docker compose build     # once, and again after an upstream update
#   docker compose up -d
#   docker compose logs -f
#
# NVIDIA by default. On AMD, swap the commented lines below: the ROCm image, Dockerfile.rocm, HIP_ARCHITECTURES and
# the GPU devices in place of the deploy section.

name: strata-slim

services:
  strata-slim:
    image: strata-slim:0.2.11
    # image: strata-slim:0.2.11-rocm
    build:
      context: .
      dockerfile: Dockerfile
      # dockerfile: Dockerfile.rocm
      args:
        CUDA_ARCHITECTURES: "86"                   # 86 = RTX 30, 89 = RTX 40, 120 = RTX 50; several: "86;89"
        # HIP_ARCHITECTURES: "gfx1100;gfx1201"     # gfx1100 = RX 7900, gfx1101 = RX 7800/7700, gfx1201 = RX 9070, gfx1200 = RX 9060
        BUILD_JOBS: "4"                            # parallel compile jobs: each can take several GB of RAM
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:8080:8080"                      # 8080:8080 opens it to your network: set API_KEY in .env then
    volumes:
      - ./models:/models                           # downloads, packs, MTP layer, DFlash2 (100+ GB, written on the first start)
      - ./data:/data                               # the generated config and the logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # devices:
    #   - /dev/kfd
    #   - /dev/dri
